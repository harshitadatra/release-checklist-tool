services:
  db:
    image: postgres:16-alpine
    container_name: releasecheck-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: releasecheck
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: releasecheck-server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/releasecheck?schema=public
      PORT: 4000
      CORS_ORIGIN: '*'
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss && node src/index.js"

volumes:
  postgres_data:
